# InnoRouter dependabot configuration.
#
# - Swift Package Manager updates surface swift-syntax bumps as
#   explicit PRs. `Package.swift` admits a bounded range of release
#   lines, and the committed Package.resolved keeps CI on its floor,
#   so a resolution bump is reviewed with the macro suites rather
#   than taken silently. Raising the range's upper bound is a manual
#   change after the `xcode-27` job passes on the new line.
# - GitHub Actions updates surface workflow action bumps so the
#   pinned `maxim-lobanov/setup-xcode` / `xcode-version` chain stays
#   current.
#
# Weekly cadence keeps PR pressure manageable; bump to daily only
# after the principle-gates baseline regeneration story is fully
# automated.

version: 2

updates:
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "swift-package"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
