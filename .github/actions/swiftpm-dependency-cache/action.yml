name: SwiftPM dependency cache
description: Restore dependency sources and SwiftSyntax prebuilts without caching product build outputs

inputs:
  enabled:
    description: Set to false to bypass cache restore and save
    required: false
    default: "true"

outputs:
  cache-hit:
    description: Whether the exact dependency cache key was restored
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Fingerprint Swift toolchain
      id: toolchain
      if: ${{ inputs.enabled == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        fingerprint="$(
          {
            xcodebuild -version
            swift --version
            xcrun --sdk macosx --show-sdk-build-version
            uname -m
          } | shasum -a 256 | awk '{print $1}'
        )"
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

    - name: Restore SwiftPM dependencies
      id: cache
      if: ${{ inputs.enabled == 'true' }}
      continue-on-error: true
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .build/repositories
          .build/checkouts
          .build/prebuilts
          ~/Library/Caches/org.swift.swiftpm/repositories/swift-syntax-*
          ~/Library/Caches/org.swift.swiftpm/repositories/InnoRouter-*
          ~/Library/Caches/org.swift.swiftpm/prebuilts/swift-syntax
        key: swiftpm-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Package.swift', 'Package.resolved', 'ConsumerSmoke/Package.swift', 'ConsumerSmoke/Package.resolved', 'MigrationSmoke/**/Package.swift', 'MigrationSmoke/**/Package.resolved') }}

    - name: Report SwiftPM dependency cache
      if: ${{ always() }}
      shell: bash
      env:
        CACHE_ENABLED: ${{ inputs.enabled }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        CACHE_OUTCOME: ${{ steps.cache.outcome }}
        TOOLCHAIN_FINGERPRINT: ${{ steps.toolchain.outputs.fingerprint }}
      run: |
        set -euo pipefail
        if [[ "$CACHE_ENABLED" != "true" ]]; then
          status="disabled"
        elif [[ "$CACHE_OUTCOME" == "failure" ]]; then
          status="error-fallback"
        elif [[ "$CACHE_HIT" == "true" ]]; then
          status="exact-hit"
        else
          status="miss"
        fi
        {
          echo "### SwiftPM dependency cache"
          echo "- status: \`$status\`"
          echo "- toolchain: \`${TOOLCHAIN_FINGERPRINT:-not-computed}\`"
          echo "- scope: dependency sources and SwiftSyntax prebuilts only"
        } >> "$GITHUB_STEP_SUMMARY"
