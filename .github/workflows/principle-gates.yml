name: principle-gates

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Source-level lint gates run independently of the heavy
  # swift-test / DocC pipeline so they fail fast on grep-detectable
  # regressions (Hangul, legacy symbols, doc drift) without paying
  # the full build cost. Same script the parent `principle-gates.sh`
  # delegates to; running it in its own job lets the two slices
  # parallelize on PRs.
  lint:
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install lint tools
        run: brew install actionlint ripgrep swiftformat swiftlint

      - name: Run workflow lint
        run: actionlint -config-file .github/actionlint.yaml

      - name: Run source-level lint gates
        run: ./scripts/lint-source-gates.sh

  changelog-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The check needs both BASE_REF and HEAD reachable so it
          # can diff the touched paths.
          fetch-depth: 0

      - name: Test CHANGELOG sync gate
        run: bash ./scripts/test-check-changelog-sync.sh

      - name: Verify CHANGELOG matches public-API baseline change
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/check-changelog-sync.sh

  release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test release metadata contract
        run: bash ./scripts/test-resolve-release-metadata.sh

      - name: Test release version policy
        run: bash ./scripts/test-release-version-policy.sh

      - name: Test latest publication policy
        run: bash ./scripts/test-resolve-latest-publication.sh

      - name: Test exact release ref contract
        run: bash ./scripts/test-verify-release-ref.sh

      - name: Test release changelog contract
        run: bash ./scripts/test-check-release-changelog.sh

      - name: Test simulator selection contract
        run: bash ./scripts/test-select-simulator.sh

  gates:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Xcode is pinned (rather than a floating latest channel) so runs of this
      # workflow are reproducible across the lifetime of a release.
      # Swift 6.3 is the floor declared in Package.swift; the pinned
      # Xcode below satisfies that. Bump this pin from RELEASING.md's
      # checklist when cutting a new release — see the "Toolchain pin"
      # section there for the policy.
      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Install gate tools
        run: brew install ripgrep swiftformat swiftlint

      - name: Run Principle Gates
        run: ./scripts/principle-gates.sh
