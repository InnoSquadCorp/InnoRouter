name: performance-smoke

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to check out
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - name: Swift Version
        run: swift --version

      # This suite expands 10/50/100-case @Routable enums and exercises every
      # generated CasePath shape. Its coarse runtime ceiling is intentionally
      # generous: this is a catastrophic-regression guard, not a benchmark.
      - name: Run Macro Performance Smoke
        run: swift test --jobs 2 --filter MacroPerformanceTests

      - name: Run Canonical Runtime Performance Smoke
        run: ./scripts/performance-smoke.sh .build/performance-smoke.json

      - name: Upload Runtime Performance Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-smoke-report
          path: .build/performance-smoke.json
          if-no-files-found: warn
