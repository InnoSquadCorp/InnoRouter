name: performance-smoke

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - name: Swift Version
        run: swift --version

      # The script fails non-zero when any scaling ratio exceeds its
      # embedded threshold. Before this change the workflow only
      # uploaded the JSON — regressions needed manual artefact
      # inspection to catch.
      - name: Run Performance Smoke
        run: ./scripts/performance-smoke.sh .build/performance-smoke.json

      - name: Upload Performance Smoke Artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-smoke
          path: .build/performance-smoke.json
