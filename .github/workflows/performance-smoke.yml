name: performance-smoke

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Swift Version
        run: swift --version

      # The script fails non-zero when any scaling ratio exceeds its
      # embedded threshold. Before this change the workflow only
      # uploaded the JSON — regressions needed manual artefact
      # inspection to catch.
      - name: Run Performance Smoke
        run: ./scripts/performance-smoke.sh .build/performance-smoke.json

      - name: Upload Performance Smoke Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-smoke
          path: .build/performance-smoke.json
