name: performance-smoke

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to check out
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: performance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.run_id }}${{ (vars.INNO_JOB_CANCELLATION == 'enabled' && github.event_name == 'pull_request') && format('-jobs-{0}-{1}', github.run_id, github.run_attempt) || '' }}
  cancel-in-progress: ${{ !(vars.INNO_JOB_CANCELLATION == 'enabled' && github.event_name == 'pull_request') && (true) }}

jobs:
  smoke:
    concurrency:
      group: scoped-job-v1-${{ github.repository }}-${{ github.workflow }}-performance-smoke.yml-smoke-pr-${{ github.event.pull_request.number }}-base-${{ github.event.pull_request.base.ref }}-${{ contains(github.event.pull_request.labels.*.name, 'release-validation') && 'release-validation' || 'no-release-validation' }}-${{ (vars.INNO_JOB_CANCELLATION == 'enabled' && github.event_name == 'pull_request' && !((github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base))))) && 'active' || format('off-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: ${{ vars.INNO_JOB_CANCELLATION == 'enabled' && github.event_name == 'pull_request' && !((github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base)))) }}
    if: github.workflow != 'performance-smoke' || vars.INNOROUTER_CI_AGGREGATE != 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - name: Swift Version
        run: swift --version

      # This suite expands 10/50/100-case @Routable enums and exercises every
      # generated CasePath shape. Its coarse runtime ceiling is intentionally
      # generous: this is a catastrophic-regression guard, not a benchmark.
      - name: Run Macro Performance Smoke
        run: swift test --jobs 2 --filter MacroPerformanceTests

      - name: Run Canonical Runtime Performance Smoke
        run: ./scripts/performance-smoke.sh .build/performance-smoke.json

      - name: Upload Runtime Performance Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-smoke-report
          path: .build/performance-smoke.json
          if-no-files-found: warn
