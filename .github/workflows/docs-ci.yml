name: docs-ci

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docc:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - name: Swift Version
        run: swift --version

      - name: Build DocC Site
        run: ./scripts/build-docc-site.sh --version preview --skip-latest

      - name: Package DocC Preview Artifact
        run: tar -czf .build/docc-site-preview.tar.gz -C .build docc-site

      - name: Upload DocC Preview Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docc-site-preview
          path: .build/docc-site-preview.tar.gz
