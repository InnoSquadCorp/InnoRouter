name: docs-ci

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: docs-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  docc:
    if: github.workflow != 'docs-ci' || vars.INNOROUTER_CI_AGGREGATE != 'true'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - name: Swift Version
        run: swift --version

      - name: Build DocC Site
        run: ./scripts/build-docc-site.sh --version preview --skip-latest

      - name: Package DocC Preview Artifact
        run: tar -czf .build/docc-site-preview.tar.gz -C .build docc-site

      - name: Upload DocC Preview Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docc-site-preview
          path: .build/docc-site-preview.tar.gz
