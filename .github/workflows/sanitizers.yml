name: sanitizers

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to check out
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: sanitizers-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.run_id }}${{ (vars.INNO_JOB_CANCELLATION == 'enabled' && github.event_name == 'pull_request') && format('-jobs-{0}-{1}', github.run_id, github.run_attempt) || '' }}
  cancel-in-progress: ${{ !(vars.INNO_JOB_CANCELLATION == 'enabled' && github.event_name == 'pull_request') && (true) }}

jobs:
  sanitizer:
    concurrency:
      group: scoped-job-v1-${{ github.repository }}-${{ github.workflow }}-sanitizers.yml-sanitizer-pr-${{ github.event.pull_request.number }}-base-${{ github.event.pull_request.base.ref }}-${{ contains(github.event.pull_request.labels.*.name, 'release-validation') && 'release-validation' || 'no-release-validation' }}-${{ matrix.kind }}-${{ (vars.INNO_JOB_CANCELLATION == 'enabled' && github.event_name == 'pull_request' && !((github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base))))) && 'active' || format('off-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: ${{ vars.INNO_JOB_CANCELLATION == 'enabled' && github.event_name == 'pull_request' && !((github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base)))) }}
    if: github.workflow != 'sanitizers' || vars.INNOROUTER_CI_AGGREGATE != 'true'
    name: ${{ matrix.kind }} sanitizer
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        kind:
          - thread
          - address

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Run ${{ matrix.kind }} sanitizer smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/sanitizer-logs
          ./scripts/sanitizer-smoke.sh "${{ matrix.kind }}" 2>&1 \
            | tee ".build/sanitizer-logs/${{ matrix.kind }}.log"

      - name: Replay failed address tests under LLDB
        if: failure() && matrix.kind == 'address'
        run: ./scripts/diagnose-sanitizer-failure.sh address

      - name: Collect router crash reports
        if: failure()
        shell: bash
        run: |
          mkdir -p .build/sanitizer-logs/crashes
          # CrashReporter can finish after SwiftPM returns. Preserve only this
          # package's test/helper reports, never unrelated runner diagnostics.
          for attempt in 1 2 3 4 5; do
            for report_dir in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
              if [[ -d "$report_dir" ]]; then
                find "$report_dir" -maxdepth 1 -type f \
                  \( -name '*InnoRouter*.ips' -o -name '*InnoRouter*.crash' \
                     -o -name '*swiftpm-testing-helper*.ips' \) \
                  -exec cp {} .build/sanitizer-logs/crashes/ \;
              fi
            done
            if [[ -n "$(find .build/sanitizer-logs/crashes -type f -print -quit)" ]]; then
              break
            fi
            if [[ "$attempt" -lt 5 ]]; then sleep 2; fi
          done

      - name: Upload sanitizer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sanitizer-${{ matrix.kind }}-${{ github.run_attempt }}
          path: .build/sanitizer-logs
          if-no-files-found: error

  required:
    name: Sanitizers Required
    if: always() && (github.workflow != 'sanitizers' || vars.INNOROUTER_CI_AGGREGATE != 'true')
    needs: [sanitizer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow == 'release' && 'refs/heads/main' || inputs.ref || github.sha }}
          persist-credentials: false
      - name: Require every matrix
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-policy.py require --jobs sanitizer
