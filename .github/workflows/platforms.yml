name: platforms

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to check out
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: platforms-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-matrix:
    name: build ${{ matrix.platform.name }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: iOS
            destination: "generic/platform=iOS Simulator"
          - name: iPadOS
            destination: "generic/platform=iOS Simulator"
          - name: macOS
            destination: "platform=macOS"
          - name: tvOS
            destination: "generic/platform=tvOS Simulator"
          - name: watchOS
            destination: "generic/platform=watchOS Simulator"
          - name: visionOS
            destination: "generic/platform=visionOS Simulator"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # This build job is compile-only. The authoritative macOS
      # correctness gate remains the `gates` workflow; these jobs catch
      # per-platform SwiftUI / availability regressions on a fixed
      # Xcode toolchain.
      #
      # Xcode is pinned (rather than a floating latest channel) so the platform
      # matrix stays reproducible across the lifetime of a release.
      # Swift 6.3 is the floor declared in Package.swift; the pinned
      # Xcode below satisfies that. Bump this pin from RELEASING.md's
      # checklist when cutting a new release — see the "Toolchain pin"
      # section there for the policy.
      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      # Build every shipped implementation surface explicitly. This keeps an
      # Effects- or Testing-only availability/import regression from hiding
      # behind the dependency graph of SwiftUI and Spatial consumers.
      # Generic simulator destinations are intentional so the compile-only
      # gate does not depend on runner-specific device names or installed
      # runtime image names. The scheme names match `xcodebuild -list`
      # output from the Swift package.
      - name: Build InnoRouter for ${{ matrix.platform.name }}
        run: |
          xcodebuild build \
            -scheme InnoRouter \
            -destination '${{ matrix.platform.destination }}' \
            -quiet

      - name: Build InnoRouterSwiftUI for ${{ matrix.platform.name }}
        run: |
          xcodebuild build \
            -scheme InnoRouterSwiftUI \
            -destination '${{ matrix.platform.destination }}' \
            -quiet

      - name: Build InnoRouterSpatial for ${{ matrix.platform.name }}
        run: |
          xcodebuild build \
            -scheme InnoRouterSpatial \
            -destination '${{ matrix.platform.destination }}' \
            -quiet

      - name: Build InnoRouterCore for ${{ matrix.platform.name }}
        run: |
          xcodebuild build \
            -scheme InnoRouterCore \
            -destination '${{ matrix.platform.destination }}' \
            -quiet

      - name: Build InnoRouterDeepLink for ${{ matrix.platform.name }}
        run: |
          xcodebuild build \
            -scheme InnoRouterDeepLink \
            -destination '${{ matrix.platform.destination }}' \
            -quiet

      - name: Build InnoRouterEffects for ${{ matrix.platform.name }}
        run: |
          xcodebuild build \
            -scheme InnoRouterEffects \
            -destination '${{ matrix.platform.destination }}' \
            -quiet

      - name: Build InnoRouterMacros for ${{ matrix.platform.name }}
        run: |
          xcodebuild build \
            -scheme InnoRouterMacros \
            -destination '${{ matrix.platform.destination }}' \
            -quiet

      - name: Build InnoRouterTesting for ${{ matrix.platform.name }}
        run: |
          xcodebuild build \
            -scheme InnoRouterTesting \
            -destination '${{ matrix.platform.destination }}' \
            -quiet

      # Building the declaration product is not enough to prove that a client
      # can expand @Router after importing only the default umbrella. This
      # target contains the downstream macro-first smoke fixture.
      - name: Build macro-first consumer for ${{ matrix.platform.name }}
        run: |
          xcodebuild build \
            -workspace .github/platform-tests.xcworkspace \
            -scheme InnoRouterMacroFirstSmoke \
            -destination '${{ matrix.platform.destination }}' \
            -quiet

      # Swift optimization has distinct actor-deinitialization paths that a
      # Debug-only matrix cannot exercise. Keep the Spatial product's shipping
      # configuration covered on its native platform.
      - name: Build InnoRouterSpatial Release for visionOS
        if: matrix.platform.name == 'visionOS'
        run: |
          xcodebuild build \
            -scheme InnoRouterSpatial \
            -configuration Release \
            -destination '${{ matrix.platform.destination }}' \
            -quiet

      - name: Build visionOS human-facing Spatial example
        if: matrix.platform.name == 'visionOS'
        run: |
          xcodebuild build \
            -workspace .github/platform-tests.xcworkspace \
            -scheme InnoRouterVisionOSImmersiveExample \
            -destination '${{ matrix.platform.destination }}' \
            -quiet

      - name: Build visionOS spatial consumer smoke
        if: matrix.platform.name == 'visionOS'
        run: |
          xcodebuild build \
            -workspace .github/platform-tests.xcworkspace \
            -scheme InnoRouterSpatialConsumerSmoke \
            -destination '${{ matrix.platform.destination }}' \
            -quiet

  platform-tests:
    name: test ${{ matrix.platform.name }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: tvOS
            destination: "tvOS Simulator"
            runtimePrefix: "com.apple.CoreSimulator.SimRuntime.tvOS"
            minimumPassedTests: 5
            testPackage: root
          - name: watchOS
            destination: "watchOS Simulator"
            runtimePrefix: "com.apple.CoreSimulator.SimRuntime.watchOS"
            minimumPassedTests: 3
            testPackage: root
          - name: visionOS
            destination: "visionOS Simulator"
            runtimePrefix: "com.apple.CoreSimulator.SimRuntime.xrOS"
            # xcresult summary counts a parameterized @Test function once;
            # its argument iterations are validated by the test result itself.
            minimumPassedTests: 25
            testPackage: consumer

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Select ${{ matrix.platform.name }} simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          devices_json="$(mktemp)"
          xcrun simctl list devices available -j > "$devices_json"

          if ! simulator_udid="$(
            python3 ./scripts/select-simulator.py \
              "$devices_json" \
              '${{ matrix.platform.runtimePrefix }}'
          )"; then
            echo "No available ${{ matrix.platform.name }} simulator found."
            cat "$devices_json"
            exit 1
          fi

          echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"

      - name: Boot ${{ matrix.platform.name }} simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 - '${{ steps.simulator.outputs.udid }}' <<'PY'
          import subprocess
          import sys

          udid = sys.argv[1]
          try:
              subprocess.run(
                  ["xcrun", "simctl", "boot", udid],
                  check=False,
                  timeout=60,
              )
          except subprocess.TimeoutExpired:
              print(
                  f"simctl boot timed out for {udid}; continuing with bootstatus",
                  file=sys.stderr,
              )

          subprocess.run(
              ["xcrun", "simctl", "bootstatus", udid, "-b"],
              check=True,
              timeout=180,
          )
          PY

      # Root-package Xcode test bundles flatten macro implementation targets
      # into the destination linker inputs. That is invalid for Spatial because
      # its compiler plugin is a host macOS executable. The visionOS suite runs
      # through ConsumerSmoke instead, which is also the stronger downstream
      # product/import/macro contract. tvOS and watchOS remain macro-free root
      # package runtime tests.
      - name: Test platform consumer for ${{ matrix.platform.name }}
        shell: bash
        run: |
          set -euo pipefail
          result_bundle="$RUNNER_TEMP/InnoRouterPlatformConsumer-${{ matrix.platform.name }}.xcresult"
          summary_json="$RUNNER_TEMP/InnoRouterPlatformConsumer-${{ matrix.platform.name }}-summary.json"
          rm -rf "$result_bundle"

          if [[ '${{ matrix.platform.testPackage }}' == 'consumer' ]]; then
            pushd ConsumerSmoke >/dev/null
            xcodebuild test \
              -scheme InnoRouterConsumerSmoke-Package \
              -destination 'platform=${{ matrix.platform.destination }},id=${{ steps.simulator.outputs.udid }}' \
              -destination-timeout 120 \
              -parallel-testing-enabled NO \
              -resultBundlePath "$result_bundle" \
              -quiet
            popd >/dev/null
          else
            xcodebuild test \
              -workspace .github/platform-tests.xcworkspace \
              -scheme InnoRouterPlatformTests \
              -destination 'platform=${{ matrix.platform.destination }},id=${{ steps.simulator.outputs.udid }}' \
              -destination-timeout 120 \
              -parallel-testing-enabled NO \
              -resultBundlePath "$result_bundle" \
              -quiet
          fi

          xcrun xcresulttool get test-results summary \
            --path "$result_bundle" \
            --compact > "$summary_json"

          python3 - "$summary_json" '${{ matrix.platform.minimumPassedTests }}' <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              summary = json.load(handle)

          minimum = int(sys.argv[2])
          passed = summary.get("passedTests")
          failed = summary.get("failedTests")
          skipped = summary.get("skippedTests")
          expected = summary.get("expectedFailures")
          print(
              f"result={summary.get('result')} "
              f"total={summary.get('totalTestCount')} "
              f"passed={passed} failed={failed} "
              f"skipped={skipped} expected={expected}"
          )

          if summary.get("result") != "Passed" or not isinstance(passed, int):
              raise SystemExit("platform test result was not a valid pass")
          if failed != 0 or skipped != 0 or expected != 0:
              raise SystemExit(
                  "platform tests must pass without failures, skips, or expected failures"
              )
          if passed < minimum:
              raise SystemExit(
                  f"only {passed} tests passed; expected at least {minimum}"
              )
          PY
