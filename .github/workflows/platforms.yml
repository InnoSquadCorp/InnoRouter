name: platforms

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to check out
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: platforms-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  inspector-ui:
    if: github.workflow != 'platforms' || vars.INNOROUTER_CI_AGGREGATE != 'true'
    name: test Inspector UI (iPadOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - name: Select iPad simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/inspector-devices.json"
          simulator_udid="$(python3 ./scripts/select-simulator.py \
            "$RUNNER_TEMP/inspector-devices.json" \
            com.apple.CoreSimulator.SimRuntime.iOS iPad)"
          echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"

      - name: Boot iPad simulator
        run: python3 ./scripts/boot-simulator.py '${{ steps.simulator.outputs.udid }}'

      - name: Verify Inspector interactions
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          test_status=0
          xcodebuild test \
            -project NativeSceneSmoke/NativeSceneSmoke.xcodeproj \
            -scheme RouterInspectorProbe \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/InspectorUI-derived" \
            -resultBundlePath "$RUNNER_TEMP/InspectorUI.xcresult" \
            CODE_SIGNING_ALLOWED=NO -quiet || test_status=$?
          # Read the bundle before honoring a failure: `-quiet` names a failing
          # test but not the assertion, which is printed here instead.
          if [[ ! -d "$RUNNER_TEMP/InspectorUI.xcresult" ]]; then
            echo "xcodebuild exited with $test_status without writing a result bundle"
            exit $(( test_status == 0 ? 1 : test_status ))
          fi
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/InspectorUI.xcresult" --compact \
            > "$RUNNER_TEMP/InspectorUI-summary.json"
          xcrun xcresulttool get test-results tests \
            --path "$RUNNER_TEMP/InspectorUI.xcresult" --compact \
            > "$RUNNER_TEMP/InspectorUI-tests.json"
          python3 scripts/report-xcresult-failures.py "$RUNNER_TEMP/InspectorUI-summary.json"
          if [[ "$test_status" -ne 0 ]]; then
            exit "$test_status"
          fi
          python3 scripts/check-inspector-ui-results.py \
            "$RUNNER_TEMP/InspectorUI-summary.json" "$RUNNER_TEMP/InspectorUI-tests.json"

      - name: Preserve Inspector UI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: inspector-ui-evidence
          path: |
            ${{ runner.temp }}/InspectorUI.xcresult
            ${{ runner.temp }}/InspectorUI-summary.json
            ${{ runner.temp }}/InspectorUI-tests.json

  build-matrix:
    if: github.workflow != 'platforms' || vars.INNOROUTER_CI_AGGREGATE != 'true'
    name: build ${{ matrix.platform.name }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: iOS
            destination: "generic/platform=iOS Simulator"
          - name: iPadOS
            destination: "generic/platform=iOS Simulator"
          - name: Mac-Catalyst
            destination: "generic/platform=macOS,variant=Mac Catalyst"
          - name: macOS
            destination: "platform=macOS"
          - name: tvOS
            destination: "generic/platform=tvOS Simulator"
          - name: watchOS
            destination: "generic/platform=watchOS Simulator"
          - name: visionOS
            destination: "generic/platform=visionOS Simulator"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      # This build job is compile-only. The authoritative macOS
      # correctness gate remains the `gates` workflow; these jobs catch
      # per-platform SwiftUI / availability regressions on a fixed
      # Xcode toolchain.
      #
      # Xcode is pinned (rather than a floating latest channel) so the platform
      # matrix stays reproducible across the lifetime of a release.
      # Swift 6.3 is the floor declared in Package.swift; the pinned
      # Xcode below satisfies that. Bump this pin from RELEASING.md's
      # checklist when cutting a new release — see the "Toolchain pin"
      # section there for the policy.
      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      # The explicit workspace prevents a neighboring or generated xcodeproj
      # from changing package resolution. The two consumers jointly compile
      # all three public products; the first also expands @Router after only
      # importing the default umbrella.
      - name: Build macro-first consumer for ${{ matrix.platform.name }}
        run: |
          xcodebuild build \
            -workspace .github/platform-tests.xcworkspace \
            -scheme InnoRouterMacroFirstSmoke \
            -destination '${{ matrix.platform.destination }}' \
            -derivedDataPath "$RUNNER_TEMP/InnoRouter-${{ matrix.platform.name }}" \
            -configuration Release \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -quiet

      - name: Build developer tools consumer for ${{ matrix.platform.name }}
        run: |
          xcodebuild build \
            -workspace .github/platform-tests.xcworkspace \
            -scheme InnoRouterDeveloperToolsSmoke \
            -destination '${{ matrix.platform.destination }}' \
            -derivedDataPath "$RUNNER_TEMP/InnoRouter-${{ matrix.platform.name }}" \
            -configuration Release \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -quiet

      - name: Validate public interfaces for ${{ matrix.platform.name }}
        run: |
          ./scripts/check-platform-interface.sh \
            "$RUNNER_TEMP/InnoRouter-${{ matrix.platform.name }}" \
            '${{ matrix.platform.name }}'

  platform-tests:
    if: github.workflow != 'platforms' || vars.INNOROUTER_CI_AGGREGATE != 'true'
    name: test ${{ matrix.platform.name }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: iOS
            destination: "iOS Simulator"
            runtimePrefix: "com.apple.CoreSimulator.SimRuntime.iOS"
            deviceNameContains: "iPhone"
            usesSimulator: true
            minimumPassedTests: 10
          - name: iPadOS
            destination: "iOS Simulator"
            runtimePrefix: "com.apple.CoreSimulator.SimRuntime.iOS"
            deviceNameContains: "iPad"
            usesSimulator: true
            minimumPassedTests: 10
          - name: Mac-Catalyst
            destination: "macOS,variant=Mac Catalyst"
            runtimePrefix: ""
            deviceNameContains: ""
            usesSimulator: false
            minimumPassedTests: 10
          - name: tvOS
            destination: "tvOS Simulator"
            runtimePrefix: "com.apple.CoreSimulator.SimRuntime.tvOS"
            deviceNameContains: ""
            usesSimulator: true
            minimumPassedTests: 12
          - name: watchOS
            destination: "watchOS Simulator"
            runtimePrefix: "com.apple.CoreSimulator.SimRuntime.watchOS"
            deviceNameContains: ""
            usesSimulator: true
            minimumPassedTests: 6
          - name: visionOS
            destination: "visionOS Simulator"
            runtimePrefix: "com.apple.CoreSimulator.SimRuntime.xrOS"
            deviceNameContains: ""
            usesSimulator: true
            minimumPassedTests: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Select ${{ matrix.platform.name }} simulator
        if: matrix.platform.usesSimulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          devices_json="$(mktemp)"
          xcrun simctl list devices available -j > "$devices_json"

          if ! simulator_udid="$(
            python3 ./scripts/select-simulator.py \
              "$devices_json" \
              '${{ matrix.platform.runtimePrefix }}' \
              '${{ matrix.platform.deviceNameContains }}'
          )"; then
            echo "No available ${{ matrix.platform.name }} simulator found."
            cat "$devices_json"
            exit 1
          fi

          echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"

      - name: Boot ${{ matrix.platform.name }} simulator
        if: matrix.platform.usesSimulator
        run: python3 ./scripts/boot-simulator.py '${{ steps.simulator.outputs.udid }}'

      # A finite A/B experiment for #54, not a retry-until-green mechanism.
      # Both variants use this exact production checkout, simulator and runner;
      # only the test fixture's explicit appearance/layout switch changes.
      - name: Compare original and explicit visionOS tab mounting
        id: mount_comparison
        if: matrix.platform.name == 'visionOS' && github.event_name == 'pull_request' && github.event.pull_request.number == 54
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          fixture=Tests/InnoRouterPlatformTests/RouterRestoredTabHostTests.swift
          evidence="$RUNNER_TEMP/RestoredTabMountComparison"
          mkdir -p "$evidence"
          cp "$fixture" "$evidence/explicit.swift"
          trap 'cp "$evidence/explicit.swift" "$fixture"' EXIT
          git rev-parse HEAD > "$evidence/commit.txt"
          xcodebuild -version > "$evidence/toolchain.txt"
          swift --version >> "$evidence/toolchain.txt"
          xcrun simctl list devices available --json > "$evidence/devices.json"
          printf '%s\n' "$SIMULATOR_UDID" > "$evidence/device-udid.txt"

          for variant in original explicit; do
            cp "$evidence/explicit.swift" "$fixture"
            if [[ "$variant" == original ]]; then
              python3 - "$fixture" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          marker = "private let explicitlyMountsRestoredTabs = true"
          if source.count(marker) != 1:
              raise SystemExit("Expected exactly one explicit-mount fixture switch")
          path.write_text(source.replace(marker, marker.replace("true", "false")))
          PY
            fi
            cp "$fixture" "$evidence/$variant.swift"
            result_bundle="$evidence/$variant.xcresult"
            test_status=0
            xcodebuild test \
              -workspace .github/platform-tests.xcworkspace \
              -scheme InnoRouterPlatformTests \
              -destination "platform=visionOS Simulator,id=$SIMULATOR_UDID" \
              -destination-timeout 120 \
              -parallel-testing-enabled NO \
              -only-testing:InnoRouterPlatformTests/RouterRestoredTabHostTests \
              -derivedDataPath "$RUNNER_TEMP/RestoredTabMountComparison-derived" \
              -resultBundlePath "$result_bundle" \
              -quiet > "$evidence/$variant.log" 2>&1 || test_status=$?
            cat "$evidence/$variant.log"
            printf '%s\n' "$test_status" > "$evidence/$variant-exit.txt"
            if [[ -d "$result_bundle" ]]; then
              xcrun xcresulttool get test-results summary --path "$result_bundle" --compact \
                > "$evidence/$variant-summary.json" || true
              xcrun xcresulttool get test-results tests --path "$result_bundle" --compact \
                > "$evidence/$variant-tests.json" || true
            fi
          done
          cp "$evidence/explicit.swift" "$fixture"
          cmp "$fixture" "$evidence/explicit.swift"

          python3 - "$evidence" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          results = {}
          for variant in ("original", "explicit"):
              summary_path = root / f"{variant}-summary.json"
              try:
                  summary = json.loads(summary_path.read_text())
              except (OSError, ValueError):
                  summary = {}
              failures = summary.get("testFailures") or []
              results[variant] = {
                  "exit": int((root / f"{variant}-exit.txt").read_text()),
                  "result": summary.get("result"),
                  "total": summary.get("totalTestCount"),
                  "passed": summary.get("passedTests"),
                  "failed": summary.get("failedTests"),
                  "skipped": summary.get("skippedTests"),
                  "expected": summary.get("expectedFailures"),
                  "failures": failures,
                  "fixtureSHA256": hashlib.sha256((root / f"{variant}.swift").read_bytes()).hexdigest(),
              }
          original, explicit = results["original"], results["explicit"]
          def passed(result):
              return (result["exit"] == 0 and result["result"] == "Passed"
                      and result["total"] == result["passed"] == 1
                      and result["failed"] == result["skipped"] == result["expected"] == 0)
          original_failed_at_appearance = (
              original["exit"] != 0 and original["result"] == "Failed"
              and original["total"] == original["failed"] == 1
              and original["skipped"] == original["expected"] == 0
              and any('recorder.waitFor(.home, path: [], scope: ["home"])' in item.get("failureText", "")
                      for item in original["failures"])
          )
          if passed(original):
              disposition = "original-passed-failure-not-reproduced"
          elif original_failed_at_appearance:
              disposition = "original-first-appearance-failure-reproduced"
          else:
              disposition = "original-had-unexpected-failure"
          report = {
              "comparison": disposition,
              "order": ["original", "explicit"],
              "simulatorReused": True,
              "simulatorResetBetweenVariants": False,
              "simulatorUDID": (root / "device-udid.txt").read_text().strip(),
              "productionCommit": (root / "commit.txt").read_text().strip(),
              "variants": results,
          }
          (root / "comparison.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          if not passed(explicit):
              raise SystemExit("Explicit mounting did not pass its one focused test")
          if not (passed(original) or original_failed_at_appearance):
              print("Original result is inconclusive; inspect its retained diagnostics")
          PY

      # This target is deliberately macro-free so its runtime checks link on
      # tvOS, watchOS, and visionOS without a host plugin object in the bundle.
      # Catalyst runs the same sources in a hosted target for UIKit lifetimes.
      - name: Test platform consumer for ${{ matrix.platform.name }}
        # Collect the full suite even if the focused candidate failed. That
        # earlier required failure still keeps this job red.
        if: ${{ !cancelled() && (success() || steps.mount_comparison.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          result_bundle="$RUNNER_TEMP/InnoRouterPlatformConsumer-${{ matrix.platform.name }}.xcresult"
          summary_json="$RUNNER_TEMP/InnoRouterPlatformConsumer-${{ matrix.platform.name }}-summary.json"
          test_destination='platform=${{ matrix.platform.destination }}'
          test_target=(-workspace .github/platform-tests.xcworkspace -scheme InnoRouterPlatformTests)
          if [[ '${{ matrix.platform.name }}' == 'Mac-Catalyst' ]]; then
            # Mounted UIWindow lifetimes need a real UIApplication/NSApplication,
            # which the hostless SwiftPM Catalyst test runner does not create.
            test_target=(-project NativeSceneSmoke/NativeSceneSmoke.xcodeproj -scheme RouterCatalystPlatformTests CODE_SIGNING_ALLOWED=NO)
          fi
          if [[ '${{ matrix.platform.usesSimulator }}' == 'true' ]]; then
            test_destination="${test_destination},id=${{ steps.simulator.outputs.udid }}"
          fi
          rm -rf "$result_bundle"

          test_status=0
          xcodebuild test \
            "${test_target[@]}" \
            -destination "$test_destination" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -resultBundlePath "$result_bundle" \
            -quiet || test_status=$?

          # Read the bundle before honoring a failure: `-quiet` names a failing
          # test but not the assertion, which is printed here instead.
          if [[ ! -d "$result_bundle" ]]; then
            echo "xcodebuild exited with $test_status without writing a result bundle"
            exit $(( test_status == 0 ? 1 : test_status ))
          fi
          xcrun xcresulttool get test-results summary \
            --path "$result_bundle" \
            --compact > "$summary_json"
          # Keep detailed test records alongside the summary.
          xcrun xcresulttool get test-results tests \
            --path "$result_bundle" --compact \
            > "$RUNNER_TEMP/InnoRouterPlatformConsumer-${{ matrix.platform.name }}-tests.json" \
            || echo "Warning: detailed xcresult export failed" >&2
          python3 scripts/report-xcresult-failures.py "$summary_json"
          if [[ "$test_status" -ne 0 ]]; then
            exit "$test_status"
          fi

          python3 - "$summary_json" '${{ matrix.platform.minimumPassedTests }}' <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              summary = json.load(handle)

          minimum = int(sys.argv[2])
          passed = summary.get("passedTests")
          failed = summary.get("failedTests")
          skipped = summary.get("skippedTests")
          expected = summary.get("expectedFailures")
          print(
              f"result={summary.get('result')} "
              f"total={summary.get('totalTestCount')} "
              f"passed={passed} failed={failed} "
              f"skipped={skipped} expected={expected}"
          )

          if summary.get("result") != "Passed" or not isinstance(passed, int):
              raise SystemExit("platform test result was not a valid pass")
          if failed != 0 or skipped != 0 or expected != 0:
              raise SystemExit(
                  "platform tests must pass without failures, skips, or expected failures"
              )
          if passed < minimum:
              raise SystemExit(
                  f"only {passed} tests passed; expected at least {minimum}"
              )
          PY

      - name: Preserve platform test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: platform-tests-${{ matrix.platform.name }}
          path: |
            ${{ runner.temp }}/InnoRouterPlatformConsumer-${{ matrix.platform.name }}.xcresult
            ${{ runner.temp }}/InnoRouterPlatformConsumer-${{ matrix.platform.name }}-summary.json
            ${{ runner.temp }}/InnoRouterPlatformConsumer-${{ matrix.platform.name }}-tests.json
            ${{ runner.temp }}/RestoredTabMountComparison
          if-no-files-found: warn

      - name: Verify native scene closure for ${{ matrix.platform.name }}
        id: native_scene
        if: matrix.platform.name == 'iPadOS' || matrix.platform.name == 'visionOS'
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          PLATFORM_NAME: ${{ matrix.platform.name }}
        run: |
          platform=ipad
          if [[ "$PLATFORM_NAME" == "visionOS" ]]; then platform=vision; fi
          ./NativeSceneSmoke/script/run_simulator.sh "$platform" "$SIMULATOR_UDID"

      # Only a probe that ran can leave logs. When an earlier step fails, the
      # probe is skipped, and a missing-logs error here would only bury the
      # original failure; a probe that ran and wrote nothing still fails.
      - name: Preserve native scene evidence
        if: always() && steps.native_scene.outcome != 'skipped' && (matrix.platform.name == 'iPadOS' || matrix.platform.name == 'visionOS')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-scene-${{ matrix.platform.name }}
          path: NativeSceneSmoke/.build/native-*/*.log
          include-hidden-files: true
          if-no-files-found: error

  required:
    name: Platforms Required
    if: always() && (github.workflow != 'platforms' || vars.INNOROUTER_CI_AGGREGATE != 'true')
    needs: [inspector-ui, build-matrix, platform-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow == 'release' && 'refs/heads/main' || inputs.ref || github.sha }}
          persist-credentials: false
      - name: Require every matrix
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-policy.py require --jobs inspector-ui build-matrix platform-tests
