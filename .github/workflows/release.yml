name: release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example 6.0.0-rc.1"
        required: false
        type: string
      version:
        description: "Candidate version; no tag is needed when publish=false"
        required: false
        type: string
      commit_sha:
        description: "Full lowercase candidate commit SHA reachable from main"
        required: false
        type: string
      publish:
        description: "Owner-approved publication of an already approved public tag"
        required: true
        type: boolean
        default: false
      prerelease:
        description: "Publish as a GitHub pre-release without updating /latest/"
        required: false
        type: boolean
        default: false

concurrency:
  group: innorouter-release-publish
  queue: max
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve candidate or approved tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      release_ref: ${{ steps.metadata.outputs.release_ref }}
      publish: ${{ steps.metadata.outputs.publish }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      commit_sha: ${{ steps.metadata.outputs.commit_sha || steps.tag.outputs.commit_sha }}
      validate: ${{ steps.metadata.outputs.validate }}
      candidate: ${{ steps.metadata.outputs.candidate }}

    steps:
      - name: Checkout release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release request
        id: metadata
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT_SHA: ${{ inputs.commit_sha }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          RELEASE_DISPATCH_REF: ${{ github.ref }}
          RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2129
          if [[ "$RELEASE_EVENT" == 'workflow_dispatch' && "$RELEASE_DISPATCH_REF" != 'refs/heads/main' ]]; then
            echo 'Release control must run from main.' >&2; exit 1
          fi
          # shellcheck disable=SC2129
          if [[ "$RELEASE_EVENT" == 'workflow_dispatch' && "$RELEASE_PUBLISH" != 'true' ]]; then
            if [[ -n "$RELEASE_TAG" || -z "$RELEASE_VERSION" || -z "$RELEASE_COMMIT_SHA" ]]; then
              echo 'Candidate requires version+commit_sha and no tag.' >&2; exit 1
            fi
            python3 scripts/validate-release-candidate.py --version "$RELEASE_VERSION" --commit-sha "$RELEASE_COMMIT_SHA" >> "$GITHUB_OUTPUT"
            git merge-base --is-ancestor "$RELEASE_COMMIT_SHA" refs/remotes/origin/main
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'validate=true' >> "$GITHUB_OUTPUT"
            echo 'candidate=true' >> "$GITHUB_OUTPUT"
          else
            if [[ -n "$RELEASE_VERSION" || -n "$RELEASE_COMMIT_SHA" ]]; then
              echo 'Publication/recovery uses an existing immutable tag.' >&2; exit 1
            fi
            ./scripts/resolve-release-metadata.sh "$RELEASE_EVENT" "$RELEASE_TAG" "$RELEASE_PRERELEASE" >> "$GITHUB_OUTPUT"
            metadata="$(./scripts/resolve-release-metadata.sh "$RELEASE_EVENT" "$RELEASE_TAG" "$RELEASE_PRERELEASE")"
            echo "validate=$(sed -n 's/^publish=//p' <<< "$metadata")" >> "$GITHUB_OUTPUT"
            echo 'candidate=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve exact tag commit
        if: steps.metadata.outputs.candidate != 'true'
        id: tag
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_EVENT_REF: ${{ github.ref }}
          RELEASE_EVENT_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ steps.metadata.outputs.release_ref }}
        run: |
          set -euo pipefail

          git fetch --force origin "+${RELEASE_REF}:${RELEASE_REF}"
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"

          ./scripts/verify-release-ref.sh \
            "$RELEASE_EVENT" \
            "$RELEASE_EVENT_REF" \
            "$RELEASE_EVENT_SHA" \
            "$RELEASE_REF" \
            refs/remotes/origin/main >> "$GITHUB_OUTPUT"

      - name: Validate release changelog
        if: steps.metadata.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          RELEASE_COMMIT_SHA: ${{ steps.tag.outputs.commit_sha }}
        run: |
          set -euo pipefail

          channel=ga
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            channel=prerelease
          fi

          tagged_changelog="$RUNNER_TEMP/release-CHANGELOG.md"
          git show "${RELEASE_COMMIT_SHA}:CHANGELOG.md" > "$tagged_changelog"
          ./scripts/check-release-changelog.sh \
            "$RELEASE_VERSION" \
            "$channel" \
            "$tagged_changelog"

      - name: Explain prerelease tag no-op
        if: steps.metadata.outputs.publish != 'true' && steps.metadata.outputs.candidate != 'true'
        run: |
          echo "::notice::Pre-release tag pushes are intentionally not published. Dispatch release.yml with publish=true and prerelease=true."

  platform-gates:
    name: Apple platform gates
    needs: preflight
    if: needs.preflight.outputs.validate == 'true'
    uses: ./.github/workflows/platforms.yml
    with:
      ref: ${{ needs.preflight.outputs.commit_sha }}
    permissions:
      contents: read

  coverage-gate:
    name: Coverage gate
    needs: preflight
    if: needs.preflight.outputs.validate == 'true'
    uses: ./.github/workflows/coverage.yml
    with:
      ref: ${{ needs.preflight.outputs.commit_sha }}
    permissions:
      contents: read
      id-token: write

  sanitizer-gates:
    name: Sanitizer gates
    needs: preflight
    if: needs.preflight.outputs.validate == 'true'
    uses: ./.github/workflows/sanitizers.yml
    with:
      ref: ${{ needs.preflight.outputs.commit_sha }}
    permissions:
      contents: read

  performance-gate:
    name: Performance gate
    needs: preflight
    if: needs.preflight.outputs.validate == 'true'
    uses: ./.github/workflows/performance-smoke.yml
    with:
      ref: ${{ needs.preflight.outputs.commit_sha }}
    permissions:
      contents: read

  migration-gate:
    name: Migration gate
    needs: preflight
    if: needs.preflight.outputs.validate == 'true'
    uses: ./.github/workflows/migration-smoke.yml
    with:
      ref: ${{ needs.preflight.outputs.commit_sha }}
    permissions:
      contents: read

  build:
    needs: preflight
    if: needs.preflight.outputs.validate == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ needs.preflight.outputs.version }}
      prerelease: ${{ needs.preflight.outputs.prerelease }}
      make_latest: ${{ steps.publication_policy.outputs.make_latest }}
      commit_sha: ${{ needs.preflight.outputs.commit_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.commit_sha }}
          persist-credentials: false

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - name: Swift Version
        run: swift --version

      - name: Install gate tools
        run: brew install ripgrep swiftformat swiftlint

      - name: Checkout Existing gh-pages Site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          persist-credentials: false
          path: .build/gh-pages-cache
          fetch-depth: 1

      - name: Verify Existing gh-pages Site
        shell: bash
        run: |
          if [[ ! -f ".build/gh-pages-cache/index.html" ]]; then
            echo "The existing gh-pages site is unavailable; refusing a destructive replacement." >&2
            exit 1
          fi

      - name: Resolve GitHub Latest Release Policy
        id: publication_policy
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/resolve-latest-publication.sh \
            "$RELEASE_VERSION" \
            .build/gh-pages-cache >> "$GITHUB_OUTPUT"

      - name: Run Principle Gates
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.preflight.outputs.prerelease == 'true' && 'prerelease' || 'ga' }}
        run: ./scripts/principle-gates.sh

      - name: Verify exact GA package dependency
        if: needs.preflight.outputs.publish == 'true' && needs.preflight.outputs.prerelease == 'false'
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          INNOROUTER_CONSUMER_REVISION: ${{ needs.preflight.outputs.commit_sha }}
        run: ./scripts/external-consumer-smoke.sh "$RELEASE_VERSION"

      - name: Verify exact candidate package dependency
        if: needs.preflight.outputs.candidate == 'true'
        env:
          CANDIDATE_SHA: ${{ needs.preflight.outputs.commit_sha }}
        run: python3 scripts/exact-sha-consumer.py --commit-sha "$CANDIDATE_SHA"

      - name: Build Versioned DocC Site
        env:
          INNOROUTER_DOCC_SOURCE_SHA: ${{ needs.preflight.outputs.candidate == 'true' && needs.preflight.outputs.commit_sha || '' }}
        shell: bash
        run: |
          latest_args=()
          if [[ "${{ steps.publication_policy.outputs.skip_latest }}" == "true" || "${{ needs.preflight.outputs.candidate }}" == "true" ]]; then
            latest_args+=(--skip-latest)
          fi

          ./scripts/build-docc-site.sh --version "${{ needs.preflight.outputs.version }}" --existing-site-dir .build/gh-pages-cache "${latest_args[@]}"

      - name: Package Release Site Artifact
        run: tar -czf .build/docc-site-release.tar.gz -C .build docc-site

      - name: Package candidate notes and checksums
        env:
          CANDIDATE: ${{ needs.preflight.outputs.candidate }}
          VERSION: ${{ needs.preflight.outputs.version }}
          COMMIT_SHA: ${{ needs.preflight.outputs.commit_sha }}
        run: |
          ./scripts/render-release-notes.sh "${{ needs.preflight.outputs.version }}" CHANGELOG.md .build/release-notes.md
          if [[ "$CANDIDATE" == 'true' ]]; then
            python3 - <<'PYNOTES'
          import os
          from pathlib import Path
          path = Path('.build/release-notes.md')
          source = path.read_text().replace('/blob/' + os.environ['VERSION'] + '/', '/blob/' + os.environ['COMMIT_SHA'] + '/')
          source = source.replace('from the tagged commit', 'from candidate SHA ' + os.environ['COMMIT_SHA'])
          path.write_text('Unpublished candidate; owner approval is required before a public SwiftPM tag.\n\n' + source)
          PYNOTES
          fi
          shasum -a 256 .build/docc-site-release.tar.gz .build/release-notes.md > .build/release-checksums.txt

      - name: Upload Release Site Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docc-site-release
          path: |
            .build/docc-site-release.tar.gz
            .build/release-notes.md
            .build/release-checksums.txt

  candidate-required:
    name: Candidate Required
    timeout-minutes: 5
    if: always()
    needs: [preflight, build, coverage-gate, migration-gate, performance-gate, platform-gates, sanitizer-gates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Require all candidate gates
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          VALIDATE: ${{ needs.preflight.outputs.validate }}
        run: |
          if [[ "$VALIDATE" == 'true' ]]; then
            python3 scripts/ci-policy.py require --jobs preflight build coverage-gate migration-gate performance-gate platform-gates sanitizer-gates
          else
            python3 scripts/ci-policy.py require --jobs preflight --skipped build coverage-gate migration-gate performance-gate platform-gates sanitizer-gates
          fi

  publish-gh-pages:
    if: needs.preflight.outputs.publish == 'true'
    needs:
      - preflight
      - candidate-required
      - build
      - coverage-gate
      - migration-gate
      - performance-gate
      - platform-gates
      - sanitizer-gates
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release Site Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docc-site-release
          path: .build/release-site-artifact

      - name: Extract Release Site Artifact
        run: |
          mkdir -p .build
          tar -xzf .build/release-site-artifact/docc-site-release.tar.gz -C .build

      - name: Publish gh-pages Storage Branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .build/docc-site
          force_orphan: false
          enable_jekyll: false

  create-release:
    if: needs.preflight.outputs.publish == 'true'
    needs:
      - preflight
      - candidate-required
      - build
      - coverage-gate
      - migration-gate
      - performance-gate
      - platform-gates
      - publish-gh-pages
      - sanitizer-gates
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.commit_sha }}

      - name: Render release notes from tagged changelog
        run: |
          ./scripts/render-release-notes.sh \
            "${{ needs.build.outputs.version }}" \
            CHANGELOG.md \
            .build/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: InnoRouter ${{ needs.build.outputs.version }}
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.build.outputs.make_latest }}
          generate_release_notes: true
          body_path: .build/release-notes.md
