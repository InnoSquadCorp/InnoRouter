name: release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example 5.0.0-rc.1"
        required: true
        type: string
      prerelease:
        description: "Publish as a GitHub pre-release without updating /latest/"
        required: false
        type: boolean
        default: false

concurrency:
  group: innorouter-release-publish
  queue: max
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      release_ref: ${{ steps.metadata.outputs.release_ref }}
      publish: ${{ steps.metadata.outputs.publish }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      update_latest: ${{ steps.metadata.outputs.update_latest }}
      commit_sha: ${{ steps.tag.outputs.commit_sha }}

    steps:
      - name: Checkout release policy
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release request
        id: metadata
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          set -euo pipefail
          ./scripts/resolve-release-metadata.sh \
            "$RELEASE_EVENT" \
            "$RELEASE_TAG" \
            "$RELEASE_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Resolve exact tag commit
        id: tag
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_EVENT_REF: ${{ github.ref }}
          RELEASE_EVENT_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ steps.metadata.outputs.release_ref }}
        run: |
          set -euo pipefail

          git fetch --force origin "+${RELEASE_REF}:${RELEASE_REF}"
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"

          ./scripts/verify-release-ref.sh \
            "$RELEASE_EVENT" \
            "$RELEASE_EVENT_REF" \
            "$RELEASE_EVENT_SHA" \
            "$RELEASE_REF" \
            refs/remotes/origin/main >> "$GITHUB_OUTPUT"

      - name: Validate release changelog
        if: steps.metadata.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          RELEASE_COMMIT_SHA: ${{ steps.tag.outputs.commit_sha }}
        run: |
          set -euo pipefail

          channel=ga
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            channel=prerelease
          fi

          tagged_changelog="$RUNNER_TEMP/release-CHANGELOG.md"
          git show "${RELEASE_COMMIT_SHA}:CHANGELOG.md" > "$tagged_changelog"
          ./scripts/check-release-changelog.sh \
            "$RELEASE_VERSION" \
            "$channel" \
            "$tagged_changelog"

      - name: Explain prerelease tag no-op
        if: steps.metadata.outputs.publish != 'true'
        run: |
          echo "::notice::Pre-release tag pushes are intentionally not published. Dispatch release.yml with prerelease=true."

  platform-gates:
    name: Apple platform gates
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    uses: ./.github/workflows/platforms.yml
    with:
      ref: ${{ needs.preflight.outputs.commit_sha }}
    permissions:
      contents: read

  build:
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ needs.preflight.outputs.version }}
      prerelease: ${{ needs.preflight.outputs.prerelease }}
      update_latest: ${{ needs.preflight.outputs.update_latest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.commit_sha }}

      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Swift Version
        run: swift --version

      - name: Install gate tools
        run: brew install ripgrep swiftformat swiftlint

      - name: Checkout Existing gh-pages Site
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: .build/gh-pages-cache
          fetch-depth: 1

      - name: Verify Existing gh-pages Site
        shell: bash
        run: |
          if [[ ! -f ".build/gh-pages-cache/index.html" ]]; then
            echo "The existing gh-pages site is unavailable; refusing a destructive replacement." >&2
            exit 1
          fi

      - name: Run Principle Gates
        run: ./scripts/principle-gates.sh

      - name: Build Versioned DocC Site
        shell: bash
        run: |
          latest_args=()
          if [[ "${{ needs.preflight.outputs.update_latest }}" != "true" ]]; then
            latest_args+=(--skip-latest)
          fi

          ./scripts/build-docc-site.sh --version "${{ needs.preflight.outputs.version }}" --existing-site-dir .build/gh-pages-cache "${latest_args[@]}"

      - name: Package Release Site Artifact
        run: tar -czf .build/docc-site-release.tar.gz -C .build docc-site

      - name: Upload Release Site Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docc-site-release
          path: .build/docc-site-release.tar.gz

  publish-gh-pages:
    needs:
      - build
      - platform-gates
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release Site Artifact
        uses: actions/download-artifact@v8
        with:
          name: docc-site-release
          path: .build/release-site-artifact

      - name: Extract Release Site Artifact
        run: |
          mkdir -p .build
          tar -xzf .build/release-site-artifact/docc-site-release.tar.gz -C .build

      - name: Publish gh-pages Storage Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .build/docc-site
          force_orphan: false
          enable_jekyll: false

  create-release:
    needs:
      - build
      - platform-gates
      - publish-gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: InnoRouter ${{ needs.build.outputs.version }}
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            Documentation
            - Release: https://innosquadcorp.github.io/InnoRouter/${{ needs.build.outputs.version }}/
            - Latest release docs: https://innosquadcorp.github.io/InnoRouter/latest/

            Repository references
            - README: https://github.com/InnoSquadCorp/InnoRouter/blob/${{ needs.build.outputs.version }}/README.md
            - Release checklist: https://github.com/InnoSquadCorp/InnoRouter/blob/${{ needs.build.outputs.version }}/RELEASING.md
