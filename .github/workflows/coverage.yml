name: coverage

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to check out
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Coverage uses the same pinned Xcode/Swift toolchain as the
      # principle-gates workflow so the codecov.io trend reflects the
      # exact build the gates validate. Bump alongside that workflow
      # when cutting a new release — see RELEASING.md.
      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Run tests with coverage
        # Swift Testing is concurrent in-process by default even though
        # SwiftPM's CLI help historically described `--no-parallel` as the
        # default. Be explicit so actor-heavy coverage runs remain
        # deterministic on the pinned Swift 6.3.3 toolchain.
        run: swift test --enable-code-coverage --jobs 2 --no-parallel

      - name: Generate lcov report
        run: ./scripts/generate-coverage-report.sh coverage.lcov coverage-full.lcov

      - name: Validate coverage floor
        run: |
          ./scripts/test-validate-coverage-report.sh
          ./scripts/test-summarize-coverage-report.sh
          ./scripts/validate-coverage-report.py \
            coverage.lcov \
            --minimum-line-coverage 85
          ./scripts/validate-coverage-report.py \
            coverage-full.lcov \
            --minimum-line-coverage 0
          ./scripts/summarize-coverage-report.py \
            --gated coverage.lcov \
            --comprehensive coverage-full.lcov \
            --output coverage-summary.json

      - name: Upload coverage visibility artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-visibility
          path: |
            coverage.lcov
            coverage-full.lcov
            coverage-summary.json

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage.lcov
          use_oidc: true
          fail_ci_if_error: true
          verbose: true
