name: Merged PR cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

# This is a stateful coordinator; a later notification must not preempt it.
concurrency:
  group: merged-pr-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event.pull_request.merged == true &&
      github.repository == 'InnoSquadCorp/InnoRouter' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.workflow_ref == format('{0}/.github/workflows/merged-pr-cleanup.yml@refs/heads/{1}', github.repository, github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout immutable trusted cleanup source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/merged_pr_cleanup.py
            /scripts/merged_pr_cleanup_plan.py
            /scripts/ci-cleanup-workflows.json
      - name: Inspect exact merged PR validation (dry run)
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_SOURCE_SHA: ${{ github.workflow_sha }}
          # Always dry-run; adding actions: write needs separate approval.
          CLEANUP_ENABLE_WRITES: ''
        run: |
          set -euo pipefail
          python3 -B scripts/merged_pr_cleanup.py --event "$GITHUB_EVENT_PATH"
