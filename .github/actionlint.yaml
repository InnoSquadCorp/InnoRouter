self-hosted-runner:
  labels:
    # GitHub-hosted preview image for the forward Xcode 27 lane. actionlint's
    # embedded hosted-runner list does not include preview labels yet.
    - xcode-27

paths:
  .github/workflows/release.yml:
    ignore:
      # GitHub Actions supports concurrency.queue, but actionlint 1.7.12 does
      # not yet include that key in its embedded workflow schema.
      - 'unexpected key "queue" for "concurrency" section'
